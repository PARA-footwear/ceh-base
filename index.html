<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База моделей — Цех</title>
  <style>
    :root {
      --bg: #121417;
      --card: #1c1f24;
      --border: #2c313a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --warn-bg: #2a2115;
      --warn-border: #854d0e;
      --warn-text: #fde047;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 40px;
    }

    /* Фиксированная шапка с поиском */
    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(18, 20, 23, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .search-wrap {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 14px 44px 14px 16px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-input::placeholder {
      font-weight: 400;
      color: var(--muted);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      background: #2c313a;
      color: #fff;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .status-bar {
      max-width: 720px;
      margin: 6px auto 0;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* Контейнер карточек */
    .container {
      max-width: 720px;
      margin: 14px auto 0;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      background: #23272e;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .article-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #fff;
    }

    .last-badge {
      background: rgba(59, 130, 246, 0.18);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Галерея фото */
    .gallery {
      display: flex;
      gap: 8px;
      padding: 12px 16px 4px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .gallery img {
      height: 190px;
      width: auto;
      max-width: 85%;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      scroll-snap-align: start;
      cursor: zoom-in;
      background: #14161a;
      flex-shrink: 0;
    }

    /* Таблица характеристик */
    .specs {
      padding: 10px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spec-row {
      display: grid;
      grid-template-columns: 125px 1fr;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 15px;
    }

    .spec-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .spec-label {
      color: var(--muted);
      font-size: 13px;
      padding-top: 2px;
    }

    .spec-val {
      font-weight: 500;
      color: #f9fafb;
      word-break: break-word;
    }

    .note-box {
      margin-top: 6px;
      padding: 10px 12px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 10px;
      color: var(--warn-text);
      font-size: 14px;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 16px;
    }

    /* Модалка для увеличения фото */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.92);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 92vh;
      border-radius: 8px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="search-wrap">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Введи артикул или материал..."
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
      <button id="clearBtn" class="clear-btn" aria-label="Очистить">&times;</button>
    </div>
    <div class="status-bar">
      <span id="statusText">Загрузка базы...</span>
      <span>Нажми на фото для увеличения</span>
    </div>
  </div>

  <div class="container" id="cardsContainer"></div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="Увеличенное фото" />
  </div>

  <script>
    // ВСТАВЬ СЮДА ССЫЛКУ ИЗ GOOGLE ТАБЛИЦЫ (Файл -> Поделиться -> Опубликовать в интернете -> CSV)
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTWD64pUrYGwpi86i4Q4OBBZufRzrGJnw6A7WbZ0vVzDWcxv1feoyGjY5O9nNK8XH5ZW3NID0Q217ly/pub?gid=848664746&single=true&output=csv";

    // Сколько максимум фото проверять для каждой модели (Артикул_1.jpg ... Артикул_3.jpg)
    const MAX_PHOTOS = 3;

    let allModels = [];

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const cardsContainer = document.getElementById("cardsContainer");
    const statusText = document.getElementById("statusText");

    // Надежный парсер CSV (корректно обрабатывает запятые и переносы строк внутри ячеек)
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            cell += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            cell += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ",") {
            row.push(cell.trim());
            cell = "";
          } else if (char === "\n" || (char === "\r" && nextChar === "\n")) {
            if (char === "\r") i++;
            row.push(cell.trim());
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += char;
          }
        }
      }
      if (cell.length > 0 || row.length > 0) {
        row.push(cell.trim());
        rows.push(row);
      }
      return rows;
    }

    async function loadDatabase() {
      try {
        // Добавляем timestamp, чтобы браузер не кешировал старую таблицу
        const separator = SHEET_CSV_URL.includes("?") ? "&" : "?";
        const response = await fetch(`${SHEET_CSV_URL}${separator}t=${Date.now()}`);
        if (!response.ok) throw new Error("Ошибка сети при загрузке таблицы");

        const csvText = await response.text();
        const rows = parseCSV(csvText);

        if (rows.length < 2) {
          statusText.textContent = "Таблица пуста";
          return;
        }

        // Ожидаемый порядок столбцов из скрипта:
        // 0: Артикул | 1: Кол-во фото | 2: Колодка | 3: Верх | 4: Подкладка | 5: Подошва | 6: Фурнитура | 7: Примечания
        allModels = rows.slice(1)
          .filter(r => r[0] && r[0].trim() !== "")
          .map(r => ({
            article: r[0] || "",
            photoCount: parseInt(r[1], 10) || MAX_PHOTOS,
            last: r[2] || "",
            upper: r[3] || "",
            lining: r[4] || "",
            sole: r[5] || "",
            hardware: r[6] || "",
            notes: r[7] || ""
          }));

        renderModels(allModels);
      } catch (err) {
        console.error(err);
        statusText.textContent = "Ошибка загрузки базы. Проверь ссылку CSV.";
        cardsContainer.innerHTML = `<div class="empty-state">Не удалось загрузить Google Таблицу.<br>Убедись, что таблица опубликована в формате CSV и ссылка вставлена в index.html.</div>`;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderModels(list) {
      statusText.textContent = `Найдено моделей: ${list.length}`;

      if (list.length === 0) {
        cardsContainer.innerHTML = `<div class="empty-state">По запросу ничего не найдено</div>`;
        return;
      }

      // Ограничиваем первичный рендер 50 карточками, чтобы не грузить сразу сотни фото на телефоне
      const visibleList = list.slice(0, 50);

      cardsContainer.innerHTML = visibleList.map(m => {
        const safeArt = encodeURIComponent(m.article);
        const count = Math.min(m.photoCount, MAX_PHOTOS);
        let imagesHtml = "";

        for (let i = 1; i <= count; i++) {
          const src = `photos/${safeArt}_${i}.jpg`;
          // Если фотки с таким номером нет — прячем тег img, чтобы не висела битая иконка
          imagesHtml += `<img src="${src}" loading="lazy" alt="${escapeHtml(m.article)}" onclick="openLightbox('${src}')" onerror="this.style.display='none'" />`;
        }

        const specRows = [
          { label: "Верх", val: m.upper },
          { label: "Подкладка", val: m.lining },
          { label: "Подошва", val: m.sole },
          { label: "Фурнитура", val: m.hardware }
        ]
          .filter(item => item.val !== "")
          .map(item => `
            <div class="spec-row">
              <div class="spec-label">${item.label}</div>
              <div class="spec-val">${escapeHtml(item.val)}</div>
            </div>
          `)
          .join("");

        return `
          <div class="card">
            <div class="card-header">
              <div class="article-title">${escapeHtml(m.article)}</div>
              ${m.last ? `<div class="last-badge">Колодка: ${escapeHtml(m.last)}</div>` : ""}
            </div>
            <div class="gallery">${imagesHtml}</div>
            <div class="specs">
              ${specRows || `<div class="spec-label">Материалы ещё не заполнены</div>`}
              ${m.notes ? `<div class="note-box">Важно: ${escapeHtml(m.notes)}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    // Мгновенный поиск по артикулу, материалам и примечаниям
    searchInput.addEventListener("input", () => {
      const q = searchInput.value.trim().toLowerCase();
      clearBtn.style.display = q ? "flex" : "none";

      if (!q) {
        renderModels(allModels);
        return;
      }

      const filtered = allModels.filter(m =>
        m.article.toLowerCase().includes(q) ||
        m.last.toLowerCase().includes(q) ||
        m.upper.toLowerCase().includes(q) ||
        m.lining.toLowerCase().includes(q) ||
        m.sole.toLowerCase().includes(q) ||
        m.notes.toLowerCase().includes(q)
      );

      // Сортируем так, чтобы точное совпадение по артикулу всегда было самым первым
      filtered.sort((a, b) => {
        const aExact = a.article.toLowerCase().startsWith(q) ? 0 : 1;
        const bExact = b.article.toLowerCase().startsWith(q) ? 0 : 1;
        return aExact - bExact;
      });

      renderModels(filtered);
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearBtn.style.display = "none";
      renderModels(allModels);
      searchInput.focus();
    });

    function openLightbox(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("active");
    }

    loadDatabase();
  </script>
</body>
</html>
